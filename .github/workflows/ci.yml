name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Runs pull request code, so it holds no secret and only a read-only token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test "scripts/self-fix/*.test.mjs" "scripts/review-gate/*.test.mjs"
